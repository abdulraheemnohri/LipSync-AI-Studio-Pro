<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="skinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdbac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c691;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hairGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f08;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Head -->
  <ellipse cx="250" cy="300" rx="180" ry="220" fill="url(#skinGradient)" stroke="#000000" stroke-width="4"/>
  
  <!-- Hair -->
  <path d="M80,80 Q60,120 80,160 L420,160 Q440,120 420,80 L400,100 Q380,140 360,160 L140,160 Q160,140 180,100 Z" fill="url(#hairGradient)" stroke="#000000" stroke-width="2"/>
  
  <!-- Bangs -->
  <path d="M180,100 Q250,60 320,100 L300,140 Q250,160 200,140 Z" fill="url(#hairGradient)" stroke="#000000" stroke-width="2"/>
  
  <!-- Left Eye -->
  <ellipse cx="200" cy="220" rx="35" ry="30" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="200" cy="220" r="15" fill="#2c1810"/>
  <circle cx="205" cy="215" r="5" fill="#ffffff"/>
  
  <!-- Right Eye -->
  <ellipse cx="300" cy="220" rx="35" ry="30" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="300" cy="220" r="15" fill="#2c1810"/>
  <circle cx="305" cy="215" r="5" fill="#ffffff"/>
  
  <!-- Left Eyebrow -->
  <path d="M170,180 Q200,160 230,180" stroke="#2c1810" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Right Eyebrow -->
  <path d="M270,180 Q300,160 330,180" stroke="#2c1810" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Nose -->
  <path d="M250,220 L250,300" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="250" cy="280" rx="25" ry="15" fill="#ffdbac" stroke="#000000" stroke-width="2"/>
  
  <!-- Nostrils -->
  <ellipse cx="240" cy="290" rx="8" ry="6" fill="#000000"/>
  <ellipse cx="260" cy="290" rx="8" ry="6" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M220,340 Q250,360 280,340" stroke="#e07b7b" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Outline -->
  <ellipse cx="250" cy="300" rx="185" ry="225" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Blush -->
  <ellipse cx="180" cy="260" rx="20" ry="15" fill="#ffb6c1" opacity="0.3"/>
  <ellipse cx="320" cy="260" rx="20" ry="15" fill="#ffb6c1" opacity="0.3"/>
</svg>
