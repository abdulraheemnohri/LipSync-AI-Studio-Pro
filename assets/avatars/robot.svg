<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6baf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotDetails" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a9bc2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6a7b9f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="robotEyes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Head -->
  <rect x="100" y="100" width="300" height="350" rx="20" ry="20" fill="url(#robotBody)" stroke="#000000" stroke-width="4"/>
  
  <!-- Top Panel -->
  <rect x="120" y="80" width="260" height="40" rx="5" ry="5" fill="url(#robotDetails)" stroke="#000000" stroke-width="2"/>
  
  <!-- Antenna Base -->
  <circle cx="250" cy="80" r="15" fill="url(#robotDetails)" stroke="#000000" stroke-width="2"/>
  
  <!-- Antenna -->
  <line x1="250" y1="65" x2="250" y2="40" stroke="url(#robotDetails)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="40" r="8" fill="url(#robotDetails)" stroke="#000000" stroke-width="1"/>
  
  <!-- Left Eye -->
  <rect x="150" y="180" width="60" height="60" rx="10" ry="10" fill="url(#robotEyes)" stroke="#000000" stroke-width="3"/>
  <circle cx="180" cy="210" r="15" fill="#4a6baf"/>
  <circle cx="185" cy="205" r="5" fill="#ffffff"/>
  
  <!-- Right Eye -->
  <rect x="290" y="180" width="60" height="60" rx="10" ry="10" fill="url(#robotEyes)" stroke="#000000" stroke-width="3"/>
  <circle cx="320" cy="210" r="15" fill="#4a6baf"/>
  <circle cx="325" cy="205" r="5" fill="#ffffff"/>
  
  <!-- Mouth Panel -->
  <rect x="200" y="280" width="100" height="40" rx="5" ry="5" fill="url(#robotDetails)" stroke="#000000" stroke-width="2"/>
  <line x1="210" y1="290" x2="290" y2="290" stroke="#4a6baf" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="300" x2="290" y2="300" stroke="#4a6baf" stroke-width="2" stroke-linecap="round"/>
  <line x1="210" y1="310" x2="290" y2="310" stroke="#4a6baf" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Detail Lines -->
  <line x1="120" y1="160" x2="380" y2="160" stroke="url(#robotDetails)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="220" x2="380" y2="220" stroke="url(#robotDetails)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="280" x2="380" y2="280" stroke="url(#robotDetails)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Chin -->
  <rect x="150" y="350" width="200" height="30" rx="5" ry="5" fill="url(#robotBody)" stroke="#000000" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="220" y="380" width="60" height="40" fill="url(#robotBody)" stroke="#000000" stroke-width="2"/>
  
  <!-- Shoulders -->
  <rect x="150" y="420" width="200" height="60" rx="10" ry="10" fill="url(#robotBody)" stroke="#000000" stroke-width="2"/>
  
  <!-- Outline -->
  <rect x="95" y="95" width="310" height="360" rx="25" ry="25" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
